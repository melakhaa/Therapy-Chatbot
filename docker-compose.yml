# docker-compose.yml
# Local development environment for Sanctuary

version: "3.8"

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sanctuary-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sanctuary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for rate limiting & task queue
  redis:
    image: redis:7-alpine
    container_name: sanctuary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama for LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: sanctuary-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: sanctuary-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=http://postgres:5432
      - SUPABASE_ANON_KEY=your-anon-key
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=your-32-char-encryption-key-here
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost:19006
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --workers 1

  # Mobile Web (Expo)
  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    container_name: sanctuary-mobile
    ports:
      - "8080:80"
    environment:
      - EXPO_PUBLIC_API_BASE_URL=http://localhost:8000
      - EXPO_PUBLIC_SUPABASE_URL=http://localhost:54321
    depends_on:
      - backend
    volumes:
      - ./apps/mobile:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: sanctuary-network