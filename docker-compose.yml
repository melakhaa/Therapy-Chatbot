services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sanctuary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanctuary
      POSTGRES_PASSWORD: sanctuary
      POSTGRES_DB: sanctuary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql here runs once, alphabetically, on first boot of an empty volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanctuary -d sanctuary"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: sanctuary-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
