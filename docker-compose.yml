services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sajiwa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sajiwa
      POSTGRES_PASSWORD: sajiwa
      POSTGRES_DB: sajiwa
    ports:
      # Host port overridable via root .env (SAJIWA_DB_PORT) when 5432 is taken, e.g. by a native PostgreSQL
      - "${SAJIWA_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql here runs once, alphabetically, on first boot of an empty volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sajiwa -d sajiwa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs db/migrations/*.sql in order after the db is healthy (idempotent, tracked in
  # schema_migrations). Fresh volumes get them after db/init; existing volumes catch up here.
  migrate:
    image: pgvector/pgvector:pg17
    container_name: sajiwa-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: sajiwa
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["sh", "-c", "for f in /migrations/*.sql; do echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -h db -U sajiwa -d sajiwa -f \"$$f\"; done"]

  pgadmin:
    image: dpage/pgadmin4
    container_name: sajiwa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./db/pgadmin/pgpass:/pgpass:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
